name: Cập nhật Vietlott

# Giờ trong cron là giờ UTC. Việt Nam = UTC + 7.
#    6:45 UTC = 13:45 giờ VN  -> sau kỳ Lotto 5/35 buổi trưa (13h00)
#   11:45 UTC = 18:45 giờ VN  -> sau khi quay Power 6/55, Mega 6/45, Max 3D, 3D Pro (18h00)
#   14:45 UTC = 21:45 giờ VN  -> sau kỳ Lotto 5/35 buổi tối (21h00)
# GitHub hay chạy trễ 5-30 phút so với giờ hẹn, không sao.
on:
  schedule:
    - cron: "45 6 * * *"
    - cron: "45 11 * * *"
    - cron: "45 14 * * *"
  workflow_dispatch:        # cho phép bấm chạy tay trên GitHub

permissions:
  contents: write

concurrency:
  group: cap-nhat-vietlott
  cancel-in-progress: false

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cài môi trường Python
        run: |
          uv venv --python 3.13
          uv pip install -e .

      - name: Tải kết quả mới từ vietlott.vn
        run: uv run python cua-chi/cap_nhat.py

      - name: Chạy bàn kiểm thử chiến lược
        run: uv run python cua-chi/kiem_thu.py 30

      - name: Sinh bộ số gợi ý cho hôm nay
        run: uv run python cua-chi/goi_so.py

      - name: Dựng trang công khai (không kèm vé riêng)
        run: uv run python cua-chi/bao_cao.py web

      - name: Ghi lại vào repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/index.html
          if git diff --staged --quiet; then
            echo "Không có gì thay đổi, bỏ qua."
          else
            git commit -m "Cập nhật dữ liệu Vietlott $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')"
            git push
          fi
